<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>KTU Result Analyzer</title>

    <!-- Corrected stylesheet link -->
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="title">KTU Result Analyzer</h1>
      <div class="drag_and_drop">

        <form id="uploadForm" class="form-container" enctype="multipart/form-data">
          <div class="upload-files-container">
            <div class="drag-file-area">
              <span class="material-icons-outlined upload-icon">file_upload</span>
              <h3 class="dynamic-message">Drag & drop any file here</h3>

              <label class="label">
                or
                <span class="browse-files">
                  <input type="file" class="default-file-input" id="pdfInput" />
                  <span class="browse-files-text">browse file</span>
                  <span>from device</span>
                </span>
              </label>
            </div>

            <span class="cannot-upload-message">
              <span class="material-icons-outlined">error</span>
              Please select a file first
              <span class="material-icons-outlined cancel-alert-button">cancel</span>
            </span>

            <div class="file-block">
              <div class="file-info">
                <span class="material-icons-outlined file-icon">description</span>
                <span class="file-name"></span> |
                <span class="file-size"></span>
              </div>
              <span class="material-icons remove-file-icon">delete</span>
              <div class="progress-bar"></div>
            </div>

            <!-- Changed type to submit -->
            <button type="submit" class="upload-button">Upload</button>
          </div>
        </form>
      </div>
      <footer><p>Beta Version</p></footer>


      <script src="script.js"></script>
    </div>
  </body>
</html>
