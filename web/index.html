<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTU Result Analyzer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="drag-drop-section">
            <div class="header-section">
                <h1>Upload Files</h1>
            </div>
            <div class="drop-section">
                <div class="col">
                    <div class="cloud-icon">
                        <img class="cloud" src="./icons/cloud-upload.svg" alt="cloud">
                    </div>
                    <span>Drag & Drop</span>
                    <button class="file-selector">Browse Files</button>
                    <input type="file" class="file-selector-input"/>
                </div>
                <div class="col">
                    <div class="drop-here">Drop Here</div>
                </div>
            </div>
            <div class="list-section">
                <div class="list-title">Uploaded Files</div>
                     <ul class="list">
                        <!-- <li class="in-prog">
                            <div class="col">
                                <img class="pdflogo" src="./icons/pdf.svg" alt="pdf-logo">
                            </div>
                            <div class="col">
                                <div class="file-name">
                                    <div class="name">File Name Here</div>
                                    <span>50%</span>
                                </div>
                                <div class="file-progress">
                                    <span></span>
                                </div>
                                <div class="file-size">2.2 MB</div>
                            </div>
                            <div class="col">
                                <i class="fas fa-xmark cross"></i>
                                <i class="fas fa-check tick"></i>
                            </div>
                        </li> -->
                    </ul>
                    <button class="submit">
                        <span>Confirm</span>
                    </button>
                    <button class="download">
                        <span>Download</span>
                    </button>
                </div>    
            </div>
        </div>      
    </div>
<script src="script.js"></script>    
</body>
</html>
