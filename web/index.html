<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title" id="formTitle">Login</h1>
    
    <form id="authForm">
      <!-- Signup fields -->
      <input type="text" id="user_name" placeholder="Username" style="display:none">
      <input type="text" id="institution" placeholder="Institution" style="display:none">
      <input type="text" id="designation" placeholder="Designation" style="display:none">

      <!-- Common fields -->
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" id="submitBtn">Login</button>
      <p class="toggle">Don't have an account? <span id="toggleForm">Sign up</span></p>
      <p class="message" id="message"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
