<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"/>
    <link rel="stylesheet" href="login1.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form_container signup_container">
            <form>
                <h1 class="sign">Create Account</h1>
                <div class="socials">
                    <a href="#"><i class="ri-google-fill"></i></a>
                    <a href="#"><i class="ri-facebook-fill"></i></a>
                    <a href="#"><i class="ri-linkedin-fill"></i></a>
                </div>
                <span>or use your email for registration</span>
                <div class="form_group">
                    <input type="text" placeholder="Name">
                </div>
                <div class="form_group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form_group">
                    <input type="password" placeholder="Password">
                </div>
                <button>SIGN UP</button>
            </form>
        </div>
        <div class="form_container signin_container">
            <form>
                <h1 class="sign">Sign in</h1>
                <div class="socials">
                    <a href="#"><i class="ri-google-fill"></i></a>
                    <a href="#"><i class="ri-facebook-fill"></i></a>
                    <a href="#"><i class="ri-linkedin-fill"></i></a>
                </div>
                <span>or use your account</span>
                <div class="form_group">
                    <input type="email" placeholder="Email">
                </div>
                <div class="form_group">
                    <input type="password" placeholder="Password">
                </div>
                <a href="#" class="forgot_password">Forgot your password?</a>
                <button>SIGN IN</button>
            </form>
        </div>
        <div class="overlay_container" id="overlay_container">
            <div class="overlay_wrapper">
                <div class="overlay_panel overlay_panel_left">
                    <h1 class="over_head">Welcome Back!</h1>
                    <p class="over_para"> To keep connected with us please login with your personel info </p>
                    <button>SIGN IN</button>
                </div>
                <div class="overlay_panel overlay_panel_right">
                    <h1 class="over_head">Hello, Friend!</h1>
                    <p class="over_para">Enter your personel details and start journey with us </p>
                    <button>SIGN UP</button>
                </div>   
            </div>
            <button id="overlayBtn"></button>    
        </div>      
    </div>
<script src="login1.js"></script>    
</body>
</html>
